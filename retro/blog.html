<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sauzi.ai | Field Notes — Select File</title>
<meta name="description" content="How we think about data infrastructure, written for the people who have to live with it. No black boxes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="retro.css">
<script src="retro.js" defer></script>
</head>
<body>
<retro-header active="blog.html" tag="SELECT FILE"></retro-header>

<main class="rt-wrap rt-page" id="blogindex">
  <div class="rt-card" style="padding:44px 40px 20px">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:40px;margin-bottom:34px;flex-wrap:wrap">
      <div style="flex:1 1 420px;min-width:0">
        <h2 class="rt-h2">FIELD NOTES</h2>
        <p class="rt-lead" style="margin:0">How we think about data infrastructure, written for the people who have to live with it. No black boxes here either.</p>
      </div>
      <img class="pixel" src="brand/query-ranger-full-body.png" alt="Query Ranger" style="height:140px;width:auto;flex:none">
    </div>

    <div style="display:grid;grid-template-columns:1fr 1.15fr;gap:26px;align-items:start" class="bl-cols">
      <!-- File list -->
      <div class="rt-panel rt-panel--shadow">
        <div class="rt-panel__hd"><span>SELECT FILE</span><span class="amber">08 SAVED</span></div>
        <div id="bl-list" style="padding:8px 0"></div>
      </div>

      <!-- Now reading -->
      <div class="rt-panel rt-panel--tint rt-panel--shadow">
        <div class="rt-panel__hd"><span>NOW READING ▸ FILE <span id="bl-n">01</span></span><span class="amber" id="bl-read">6 MIN</span></div>
        <div style="padding:30px 30px 34px">
          <div style="display:flex;gap:14px;font:400 10px var(--disp);color:var(--muted);margin-bottom:18px">
            <span id="bl-tag">STRUCTURING</span><span id="bl-date">2026.08.04</span>
          </div>
          <h3 style="font:700 24px/1.45 var(--disp);color:var(--ink);margin:0 0 22px" id="bl-title"></h3>
          <p style="font:400 19px/1.8 var(--text);color:var(--body);margin:0 0 26px" id="bl-body"></p>
          <div style="border-top:3px solid var(--muted);padding-top:22px;display:flex;gap:14px;flex-wrap:wrap">
            <a id="bl-open" href="blog-ai-data-analysts.html" class="rt-btn">▶ READ FULL POST</a>
            <a href="readiness-map.html" class="rt-btn rt-btn--ghost">GET YOUR READINESS MAP</a>
          </div>
        </div>
      </div>
    </div>

    <retro-footer hint="<span>▲▼ SELECT</span><span>A: LOAD</span><span>B: BACK</span>"></retro-footer>
  </div>
</main>

<style>
@media (max-width:900px){ .bl-cols{ grid-template-columns:1fr !important; } }
</style>
</body>
</html>
